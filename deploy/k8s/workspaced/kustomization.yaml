apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pi-workspaced
# RBAC, limits, and network policy are platform-owned in bry-guy/infra.
resources:
  - workspace-env.yaml
  - workspaced.yaml
# Grant shapes for project workers (workspaced/grants.js). The hash
# suffix restarts workspaced when they change.
configMapGenerator:
  - name: pi-workspaced-grants
    files:
      - grants.json
images:
  - name: ghcr.io/bry-guy/pi-ez-web
    digest: sha256:82ed2557bedaf8ffb972f28f7f9100446517b314ec2e62255d882602732a3f41
# Workers run the same image as this gateway: copy the images-pinned reference.
replacements:
  - source:
      kind: Deployment
      name: pi-workspaced
      fieldPath: spec.template.spec.containers.[name=gateway].image
    targets:
      - select:
          kind: Deployment
          name: pi-workspaced
        fieldPaths:
          # Anchored: the name is matched as a regular expression, and unanchored it also
          # overwrote WORKSPACE_IMAGE_PULL_SECRET.
          - spec.template.spec.containers.[name=gateway].env.[name=^WORKSPACE_IMAGE$].value

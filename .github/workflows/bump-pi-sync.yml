name: bump-pi-sync

# Keeps PI_SYNC_COMMIT on pi-sync's main: tests the new pin, then commits it to main,
# which deploys like any other push to main.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Find pi-sync main
        id: upstream
        run: |
          sha=$(git ls-remote https://github.com/bry-guy/pi-sync refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" = "$(tr -d '[:space:]' < PI_SYNC_COMMIT)" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.upstream.outputs.current != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.upstream.outputs.current != 'true'
        name: Test the new pin
        run: |
          echo "${{ steps.upstream.outputs.sha }}" > PI_SYNC_COMMIT
          npm ci
          npm test
      - if: steps.upstream.outputs.current != 'true'
        name: Commit the pin to main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sync): pin pi-sync ${SHA:0:12}" -- PI_SYNC_COMMIT
          git push origin HEAD:main
          # Pushes made with the workflow token start no workflows, so start the deploy here.
          gh workflow run publish-image.yml --ref main
